name: arcore_flutter_plugin
description: Flutter plugin for ARCore SDK (vendored & patched for Gradle 9 / AGP 9).
# Owned by ar_measurement — do not replace with pub.dev.
version: 0.1.0+patched.7
homepage: https://github.com/giandifra/arcore_flutter_plugin
publish_to: 'none'

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.1.0
  meta: ^1.3.0
  equatable: ^2.0.3

flutter:
  plugin:
    platforms:
      android:
        package: com.difrancescogianmarco.arcore_flutter_plugin
        pluginClass: ArcoreFlutterPlugin
