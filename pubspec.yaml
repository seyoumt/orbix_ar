name: ar_measurement
description: Embeddable AR measurement toolkit for Flutter (ARCore / ARKit).
version: 0.1.0
homepage: https://github.com/anwar/ar_measurement
repository: https://github.com/anwar/ar_measurement
issue_tracker: https://github.com/anwar/ar_measurement/issues

topics:
  - ar
  - augmented-reality
  - measurement
  - flutter-plugin
  - arcore
  - arkit

environment:
  # Flutter 3.24+ / Dart 3.5+. Tested on Flutter 3.47.2 — see doc/SUPPORTED_TOOLCHAIN.md.
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  arkit_plugin: ^1.5.0
  # Ranges allow older hosts to resolve pre-3.9 / pre-3.12 package versions.
  json_annotation: '>=4.9.0 <5.0.0'
  logger: ^2.0.0
  path: '>=1.9.0 <2.0.0'
  permission_handler: '>=12.0.0 <14.0.0'
  sqflite: '>=2.3.3 <3.0.0'
  uuid: ^4.5.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=5.0.0 <7.0.0'
  build_runner: '>=2.4.0 <3.0.0'
  json_serializable: '>=6.8.0 <7.0.0'

# Mobile AR only — native Android plugin; iOS via arkit_plugin.
platforms:
  android:
  ios:

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.ar_measurement
        pluginClass: ArMeasurementPlugin
