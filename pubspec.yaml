name: ar_measurement
description: Embeddable AR measurement toolkit for Flutter (ARCore / ARKit).
version: 0.1.0
homepage: https://github.com/anwar/ar_measurement
repository: https://github.com/anwar/ar_measurement
issue_tracker: https://github.com/anwar/ar_measurement/issues

topics:
  - ar
  - augmented-reality
  - measurement
  - flutter-plugin
  - arcore
  - arkit

environment:
  sdk: ^3.13.2
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  arkit_plugin: ^1.5.0
  json_annotation: ^4.12.0
  logger: ^2.8.0
  path: ^1.9.1
  permission_handler: ^13.0.2
  sqflite: ^2.4.4
  uuid: ^4.5.1
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.14.1

# Mobile AR only — native Android plugin; iOS via arkit_plugin.
platforms:
  android:
  ios:

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.ar_measurement
        pluginClass: ArMeasurementPlugin
