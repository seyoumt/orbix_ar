name: ar_measurement_example
description: Example host app for the ar_measurement package.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ar_measurement:
    path: ../
  provider: ^6.1.2
  geolocator: '>=12.0.0 <15.0.0'
  share_plus: '>=10.0.0 <14.0.0'
  csv: '>=6.0.0 <9.0.0'
  intl: '>=0.19.0 <0.21.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=5.0.0 <7.0.0'

flutter:
  uses-material-design: true
